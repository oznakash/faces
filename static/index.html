<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Tokens — docs/DESIGN-GUIDELINES.md §2. No other colors, no bold, no radius, no shadows. */
  :root{--page:#f0f0f0;--surface:#f7f7f7;--surface-2:#fff;--ink:#0d0b0b;--ink-2:#7a7a7a;--ink-3:#bdbdbd;
        --hair:#dedede;--hair-2:#d6d6d6;--accent:#6385ff;--accent-hover:#4a63bd;--accent-down:#4259ab;
        --overlay:rgba(205,207,210,.6);--overlay-ink:rgba(13,11,11,.6);--danger:#cc1e1e}
  *{box-sizing:border-box}
  html{background:var(--page)}
  body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.55 Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  h1,h2,h3{font-weight:400;margin:0}
  button{font:inherit;font-weight:400;cursor:pointer}

  /* Header — the only full-width hairline */
  .top{border-bottom:1px solid var(--hair)}
  .top .in{max-width:1200px;margin:0 auto;padding:18px 24px;display:flex;align-items:baseline;justify-content:space-between}
  .mark{font-size:22px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer}
  .top nav a{font-size:13px;text-decoration:none;color:var(--ink);cursor:pointer}
  .top nav a:hover{text-decoration:underline}

  main{max-width:1200px;margin:0 auto;padding:36px 24px 80px}
  .sub{color:var(--ink-2);margin:0 0 22px;overflow-wrap:anywhere}
  .note,.status,.empty,h2 small{overflow-wrap:anywhere}
  h1{font-size:28px;letter-spacing:-.005em;margin:0 0 4px}
  h2{font-size:17px;margin:40px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h2 small{color:var(--ink-2);font-size:13px}

  form{display:flex;gap:8px;flex-wrap:wrap}
  input[type=url]{flex:1 1 220px;min-width:min(260px,100%);font:inherit;padding:12px 14px;border:1px solid var(--hair-2);border-radius:0;background:var(--surface);color:var(--ink)}
  input[type=url]::placeholder{color:var(--ink-3)}
  input[type=url]:focus{outline:none;border-color:var(--accent)}
  .btn{padding:12px 18px;border:0;border-radius:0;background:var(--accent);color:#fff;transition:background-color .12s ease}
  .btn:hover{background:var(--accent-hover)} .btn:active{background:var(--accent-down)} .btn:disabled{opacity:.5;cursor:default}
  .ghost{background:transparent;border:0;padding:0;color:var(--ink);font-size:13px}
  .ghost:hover{text-decoration:underline}

  .status{margin:22px 0 6px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--ink-2);min-height:22px;font-size:13px}
  .bar{height:2px;background:var(--hair);flex:1;min-width:160px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
  .pill{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--hair);color:var(--ink-2)}
  .pill.ok,.pill.warn{color:var(--ink)}
  .pill.bad{color:var(--danger);border-color:var(--danger)}
  .note{font-size:12px;color:var(--ink-2);margin:0 0 8px}

  /* Face wall — square crops, tight gallery gaps, no chrome */
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
  .face{cursor:pointer;text-align:center;outline:1px solid transparent;outline-offset:-1px;transition:outline-color .12s ease}
  .face:hover{outline-color:var(--accent)}
  .face.active{outline:2px solid var(--accent);outline-offset:-2px}
  .face img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
  .face .n{font-size:12px;color:var(--ink-2);padding:5px 2px 8px}
  .face .n b{font-weight:400;color:var(--ink)}

  /* Photo tiles — 4:3, hover overlay band like the source site's tile-info */
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
  .ph{position:relative;background:var(--surface-2)}
  .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .ph a{position:absolute;inset:0;color:var(--overlay-ink);text-decoration:none}
  .ph a::after{content:"Open original \2197";position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:12px;background:var(--overlay);opacity:0;transition:opacity .12s ease}
  .ph:hover a::after{opacity:1}
  .ph .s{position:absolute;right:0;top:0;font-size:11px;letter-spacing:.06em;background:var(--overlay);color:var(--overlay-ink);padding:3px 8px}

  .empty{color:var(--ink-2);padding:40px 0;text-align:center}
  .drop{border:1px solid var(--hair-2);background:var(--surface);padding:14px;color:var(--ink-2);display:flex;gap:12px;align-items:center;cursor:pointer;font-size:13px}
  .drop:hover{border-color:var(--accent)}
  .drop img{width:56px;height:56px;object-fit:cover}
  .hidden{display:none}
  .privacy{font-size:12px;color:var(--ink-2);margin-top:8px}

  /* Gallery list (home) */
  .list{display:flex;flex-direction:column;gap:8px}
  .g{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;background:var(--surface);border:1px solid var(--hair);padding:14px 16px;cursor:pointer;transition:border-color .12s ease}
  .g:hover{border-color:var(--accent)}
  .g .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g .u,.g .m{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:1}
  .g .m{font-size:13px}
  .g .link{grid-row:1/4;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .g code{font:12px/1.3 Roboto,Helvetica,Arial,sans-serif;border:1px solid var(--hair);padding:5px 8px;background:var(--surface-2);max-width:100%;overflow-wrap:anywhere}
  .g .copy{font-size:12px;background:transparent;border:0;padding:0;color:var(--ink)}
  .g .copy:hover{text-decoration:underline}
  .back{margin:0 0 18px;font-size:13px}
  @media (max-width:600px){ main{padding:24px 16px 60px} .top .in{padding:14px 16px} .g .link{grid-row:auto;align-items:flex-start} .g{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="mark" id="mark">Faces</a>
  <nav><a id="navHome">Galleries</a></nav>
</div></div>
<main>
  <h1 id="pageTitle">Point it at a public photo gallery.</h1>
  <p class="sub" id="pageSub">See everyone who's in it. Find every photo you're in.</p>
  <form id="f">
    <input id="url" type="url" required placeholder="https://… a gallery page" autocomplete="off">
    <button id="go" type="submit" class="btn">Index gallery</button>
  </form>
  <p class="back hidden" id="back"><button class="ghost" id="backBtn">&larr; All indexed galleries</button></p>

  <section id="listSec">
    <h2>Indexed galleries <small id="listCount"></small></h2>
    <div class="list" id="list"></div>
  </section>

  <div class="status" id="status"></div>
  <p class="note" id="note"></p>

  <section id="search" class="hidden">
    <h2>Find me <small>upload a selfie — it's processed in memory and never stored</small></h2>
    <label class="drop" id="drop">
      <input id="selfie" type="file" accept="image/*" class="hidden">
      <img id="selfiePreview" class="hidden" alt="">
      <span id="dropText">Drop a selfie here, or click to choose</span>
    </label>
    <div id="results"></div>
  </section>

  <section id="wallSec" class="hidden">
    <h2>People <small id="wallCount"></small></h2>
    <div class="wall" id="wall"></div>
  </section>

  <section id="personSec" class="hidden">
    <h2><span id="personTitle"></span> <small id="personCount"></small> <button class="ghost" id="closePerson">close</button></h2>
    <div class="photos" id="photos"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let gid = null, es = null;

// ---------- helpers
const fmt = n => (n ?? 0).toLocaleString();
function pill(text, cls){ return `<span class="pill ${cls||''}">${text}</span>`; }
function setStatus(html){ $('#status').innerHTML = html; }

// ---------- indexed galleries (home)
async function loadGalleries(){
  const r = await fetch('/api/galleries'); const list = await r.json();
  $('#listCount').textContent = list.length ? `${list.length} · each has a short link you can share` : '';
  $('#list').innerHTML = list.length ? list.map(g => {
    const st = g.status === 'ready' ? pill('ready','ok') : g.status === 'partial' ? pill('partial','warn')
             : g.status === 'failed' ? pill('failed','bad') : pill(g.status);
    const when = g.indexed_at ? new Date(g.indexed_at).toLocaleDateString() : '';
    return `<div class="g" data-key="${g.slug}">
      <div class="t">${g.title || g.host}</div>
      <div class="link"><code>${location.origin}/g/${g.slug}</code><button class="copy" data-slug="${g.slug}">Copy link</button></div>
      <div class="u">${g.url_canonical}</div>
      <div class="m">${st} ${fmt(g.people)} people · ${fmt(g.images_done)} photos · ${fmt(g.faces_found)} faces${when?` · ${when}`:''}</div>
    </div>`; }).join('')
    : `<div class="empty">Nothing indexed yet. Paste a gallery URL above.</div>`;
  $('#list').querySelectorAll('.g').forEach(el => el.onclick = () => open(el.dataset.key));
  $('#list').querySelectorAll('.copy').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    await navigator.clipboard.writeText(`${location.origin}/g/${b.dataset.slug}`);
    b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy link', 1200);
  });
}
function home(){
  gid = null; if (es) es.close();
  history.replaceState(null, '', '/');
  $('#pageTitle').textContent = 'Point it at a public photo gallery.';
  $('#pageSub').textContent = "See everyone who's in it. Find every photo you're in.";
  ['#wallSec','#personSec','#search','#back'].forEach(x => $(x).classList.add('hidden'));
  $('#listSec').classList.remove('hidden'); setStatus(''); $('#note').textContent = '';
  loadGalleries();
}
$('#backBtn').onclick = home;
$('#mark').onclick = home; $('#navHome').onclick = home;

// ---------- submit
$('#f').onsubmit = async e => {
  e.preventDefault();
  $('#go').disabled = true;
  const r = await fetch('/api/galleries', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({url: $('#url').value})});
  $('#go').disabled = false;
  if (!r.ok){ const err = await r.json(); setStatus(pill(err.detail?.message || 'Error','bad')); return; }
  const {slug} = await r.json();
  open(slug);
};

// ---------- open a gallery: stream progress, then render
async function open(key){
  const gr = await fetch(`/api/galleries/${key}`);
  if (!gr.ok){ setStatus(pill('not found','bad') + " that link doesn't point at an indexed gallery"); return; }
  const g0 = await gr.json();
  gid = g0.id; const id = gid;
  history.replaceState(null, '', `/g/${g0.slug}`);
  $('#listSec').classList.add('hidden'); $('#back').classList.remove('hidden');
  if (es) es.close();
  $('#wall').innerHTML = ''; $('#wallSec').classList.add('hidden');
  $('#personSec').classList.add('hidden'); $('#search').classList.add('hidden');
  $('#results').innerHTML = ''; $('#note').textContent = '';
  es = new EventSource(`/api/galleries/${id}/events`);
  es.addEventListener('status', e => {
    const g = JSON.parse(e.data);
    if (g.url_canonical) $('#url').value = g.url_canonical;
    if (g.title) { $('#pageTitle').textContent = g.title; $('#pageSub').textContent = g.url_canonical; }
    if (g.status === 'ingesting') setStatus(`${pill('opening gallery')} <span>scrolling the page to find every photo…</span>`);
    if (g.notes) $('#note').textContent = g.notes.join(' · ');
    if (g.message && !g.notes) $('#note').textContent = g.message;
  });
  es.addEventListener('progress', e => {
    const p = JSON.parse(e.data);
    if (p.phase === 'harvest'){ setStatus(`${pill('finding photos')} <span>${fmt(p.images_total)} found so far</span>`); return; }
    const pct = p.images_total ? Math.round(100*(p.images_done+p.images_failed)/p.images_total) : 0;
    setStatus(`${pill('indexing')} <div class="bar"><i style="width:${pct}%"></i></div>
      <span>${fmt(p.images_done)} / ${fmt(p.images_total)} photos · ${fmt(p.faces_found)} faces · ${p.elapsed}s</span>`);
  });
  es.addEventListener('clusters', e => { renderWall(JSON.parse(e.data).provisional); });
  es.addEventListener('done', e => {
    const d = JSON.parse(e.data); if (d.faces_excluded == null && d.faces_found != null) d.faces_excluded = d.faces_excluded ?? 0;
    const st = d.status === 'ready' ? pill('ready','ok') : d.status === 'partial' ? pill('partial','warn') : pill(d.status,'bad');
    setStatus(`${st} <span>${fmt(d.images_done)} photos · ${fmt(d.faces_found)} faces (${fmt(d.faces_excluded)} excluded for quality) · ${fmt(d.people)} people${d.elapsed?` · ${d.elapsed}s`:''}</span>`);
    if (d.images_failed) $('#note').textContent += ` · ${d.images_failed} photos failed to load`;
    renderWall(false); es.close();
  });
  es.addEventListener('error', e => {
    try { const d = JSON.parse(e.data); setStatus(pill(d.error_code,'bad') + ' ' + (d.message||'')); } catch(_){}
  });
}

// ---------- face wall
async function renderWall(provisional){
  const r = await fetch(`/api/galleries/${gid}/people`); const people = await r.json();
  $('#wallSec').classList.remove('hidden'); $('#search').classList.remove('hidden');
  $('#wallCount').textContent = `${fmt(people.length)}${provisional ? ' so far' : ''} · sorted by photo count`;
  $('#wall').innerHTML = people.length ? people.map(p =>
    `<div class="face" data-id="${p.id}" title="${p.label}">
       <img src="${p.crop_url}" alt="${p.label}" loading="lazy">
       <div class="n"><b>${fmt(p.image_count)}</b> photo${p.image_count===1?'':'s'}</div></div>`).join('')
    : `<div class="empty">No faces found yet.</div>`;
  $('#wall').querySelectorAll('.face').forEach(el => el.onclick = () => showPerson(el.dataset.id, el));
}

async function showPerson(cid, el){
  document.querySelectorAll('.face.active').forEach(x => x.classList.remove('active'));
  el?.classList.add('active');
  const r = await fetch(`/api/people/${cid}/photos`); const d = await r.json();
  $('#personSec').classList.remove('hidden');
  $('#personTitle').textContent = d.person.label;
  $('#personCount').textContent = `${fmt(d.photos.length)} photos · click any to open the original`;
  $('#photos').innerHTML = d.photos.map(ph => photoCard(ph)).join('');
  $('#personSec').scrollIntoView({behavior:'smooth', block:'start'});
}
function photoCard(ph, score){
  return `<div class="ph"><img src="${ph.source_url}" loading="lazy" alt="">
    <a href="${ph.page_url || ph.source_url}" target="_blank" rel="noopener" title="open original"></a>
    ${score!=null?`<span class="s">${Math.round(score*100)}%</span>`:''}</div>`;
}
$('#closePerson').onclick = () => $('#personSec').classList.add('hidden');

// ---------- selfie search
$('#selfie').onchange = async () => {
  const file = $('#selfie').files[0]; if (!file) return;
  $('#selfiePreview').src = URL.createObjectURL(file); $('#selfiePreview').classList.remove('hidden');
  $('#dropText').textContent = 'Searching…';
  const fd = new FormData(); fd.append('selfie', file);
  const r = await fetch(`/api/galleries/${gid}/search`, {method:'POST', body: fd});
  const d = await r.json();
  if (!r.ok){ $('#dropText').textContent = d.detail?.message || 'Search failed'; return; }
  $('#dropText').textContent = `${d.confident.length} confident · ${d.possible.length} possible${d.faces_in_selfie>1?` · using the largest of ${d.faces_in_selfie} faces`:''}`;
  $('#results').innerHTML =
    (d.confident.length ? `<h2>Confident matches <small>${d.confident.length}</small></h2><div class="photos">${d.confident.map(p=>photoCard(p,p.score)).join('')}</div>` : `<div class="empty">No confident matches in this gallery.</div>`) +
    (d.possible.length ? `<h2>Possible matches <small>${d.possible.length} · lower confidence, shown separately on purpose</small></h2><div class="photos">${d.possible.map(p=>photoCard(p,p.score)).join('')}</div>` : '');
};
const drop = $('#drop');
drop.ondragover = e => { e.preventDefault(); };
drop.ondrop = e => { e.preventDefault(); $('#selfie').files = e.dataTransfer.files; $('#selfie').onchange(); };

// ---------- routing: /g/{slug} is the shareable link; ?g= kept for old links
const _m = location.pathname.match(/^\/g\/([a-z0-9]+)/i);
const _q = new URLSearchParams(location.search).get('g');
if (_m || _q) open(_m ? _m[1] : _q); else loadGalleries();
</script>
</body>
</html>
